[project]
name = "my-opencode-cli"
version = "0.2.0"
description = "A modern Python client library for OpenCode server"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    { name = "iibyteCoder" }
]
keywords = ["opencode", "ai", "llm", "client", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "types-click",
    "types-aiofiles",
    "coverage[toml]>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
my-opencode-cli = "my_opencode_cli.cli:main"

[project.urls]
Homepage = "https://github.com/iibyteCoder/my-opencode-cli"
Documentation = "https://github.com/iibyteCoder/my-opencode-cli#readme"
Repository = "https://github.com/iibyteCoder/my-opencode-cli.git"
Issues = "https://github.com/iibyteCoder/my-opencode-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_opencode_cli"]

[tool.uv]
package = true

# 国内镜像源配置
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

# 格式化配置
[tool.ruff.format]
quote-style = "double"            # 使用双引号
indent-style = "space"            # 使用空格缩进
skip-magic-trailing-comma = false # 尊重尾随逗号决定换行
line-ending = "auto"              # 自动检测行尾

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes (包含 F401 unused imports)
  "I",     # isort (导入排序)
  "N",     # pep8-naming
  "W",     # pycodestyle warnings
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "S",     # flake8-bandit (security)
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "T20",   # flake8-print
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific rules
]
ignore = [
  "E501",   # line length handled by formatter
  "S101",   # allow assert
  "T201",   # allow print
  "RUF001", # allow Chinese characters in strings
  "RUF002", # allow Chinese punctuation in docstrings
  "RUF003", # allow Chinese punctuation in comments
  "RUF022", # allow unsorted __all__ (we use comments to organize exports)
]

# 导入排序配置
[tool.ruff.lint.isort]
known-first-party = ["opencode_client"]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true           # 合并相同模块的 from 和 import
force-wrap-aliases = true           # 强制换行带别名的导入
split-on-trailing-comma = true      # 在尾随逗号处分割

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
extra_checks = true
explicit_package_bases = true
exclude = ["^tests/", "^\\.venv/"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "pytest-aiohttp>=1.1.0",
]

[[tool.mypy.overrides]]
module = ["aiohttp.*", "rich.*"]
ignore_missing_imports = true
